<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1880" viewBox="0 0 680 940" role="img">
<title>Workplan and issues workflow</title>
<desc>Flow from a new piece of work through the workplan skill, GitHub feature, task and bug issues, the plan folder in the Obsidian vault, work on a feature branch, workplan-close part 1, the PR into dev, workplan-close part 2 and archiving to RETIRED.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.arr { stroke: #73726C; stroke-width: 1.5; fill: none; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
.purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
.gray .th { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }
.head { fill: #2C2C2A; } .legend { fill: #5F5E5A; }
</style>
</defs>
<rect x="0" y="0" width="680" height="940" fill="#FFFFFF"/>
<text class="th head" x="180" y="30" text-anchor="middle">GitHub</text>
<text class="th head" x="500" y="30" text-anchor="middle">Obsidian vault</text>

<g class="gray"><rect x="190" y="50" width="300" height="56" rx="8"/>
<text class="th" x="340" y="68" text-anchor="middle" dominant-baseline="central">New piece of work</text>
<text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central">Ask for a plan</text></g>
<line x1="340" y1="106" x2="340" y2="144" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="140" y="146" width="400" height="56" rx="8"/>
<text class="th" x="340" y="164" text-anchor="middle" dominant-baseline="central">workplan: check first</text>
<text class="ts" x="340" y="184" text-anchor="middle" dominant-baseline="central">Existing plans, issues-found.md, GitHub issues</text></g>
<path d="M260 202 L260 222 L180 222 L180 240" class="arr" marker-end="url(#arrow)"/>
<path d="M420 202 L420 222 L500 222 L500 240" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="242" width="280" height="56" rx="8"/>
<text class="th" x="180" y="260" text-anchor="middle" dominant-baseline="central">Feature issue</text>
<text class="ts" x="180" y="280" text-anchor="middle" dominant-baseline="central">Goal and acceptance criteria</text></g>
<g class="teal"><rect x="360" y="242" width="280" height="56" rx="8"/>
<text class="th" x="500" y="260" text-anchor="middle" dominant-baseline="central">Plan folder</text>
<text class="ts" x="500" y="280" text-anchor="middle" dominant-baseline="central">plans/task-name, six files</text></g>
<line x1="180" y1="298" x2="180" y2="336" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="298" x2="500" y2="336" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="338" width="280" height="56" rx="8"/>
<text class="th" x="180" y="356" text-anchor="middle" dominant-baseline="central">Task and bug sub-issues</text>
<text class="ts" x="180" y="376" text-anchor="middle" dominant-baseline="central">One PR each, story points</text></g>
<g class="teal"><rect x="360" y="338" width="280" height="56" rx="8"/>
<text class="th" x="500" y="356" text-anchor="middle" dominant-baseline="central">tasks.md, max 15 tasks</text>
<text class="ts" x="500" y="376" text-anchor="middle" dominant-baseline="central">Each row names its #issue</text></g>
<line x1="320" y1="366" x2="358" y2="366" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="394" x2="180" y2="432" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="394" x2="500" y2="432" class="arr" marker-end="url(#arrow)"/>

<g class="gray"><rect x="140" y="434" width="400" height="56" rx="8"/>
<text class="th" x="340" y="452" text-anchor="middle" dominant-baseline="central">Work on feature/* from dev</text>
<text class="ts" x="340" y="472" text-anchor="middle" dominant-baseline="central">Review, then one commit per task</text></g>
<line x1="500" y1="490" x2="500" y2="528" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="490" x2="300" y2="624" class="arr" marker-end="url(#arrow)"/>

<g class="teal"><rect x="360" y="530" width="280" height="56" rx="8"/>
<text class="th" x="500" y="548" text-anchor="middle" dominant-baseline="central">Route what you find</text>
<text class="ts" x="500" y="568" text-anchor="middle" dominant-baseline="central">Task, part 2, or issues-found.md</text></g>

<g class="teal"><rect x="140" y="626" width="400" height="56" rx="8"/>
<text class="th" x="340" y="644" text-anchor="middle" dominant-baseline="central">workplan-close, part 1</text>
<text class="ts" x="340" y="664" text-anchor="middle" dominant-baseline="central">Sweep, harvest docs, PR text, merge gate</text></g>
<line x1="180" y1="682" x2="180" y2="720" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="722" width="280" height="56" rx="8"/>
<text class="th" x="180" y="740" text-anchor="middle" dominant-baseline="central">PR into dev</text>
<text class="ts" x="180" y="760" text-anchor="middle" dominant-baseline="central">Closes #task on merge</text></g>
<g class="teal"><rect x="360" y="722" width="280" height="56" rx="8"/>
<text class="th" x="500" y="740" text-anchor="middle" dominant-baseline="central">workplan-close, part 2</text>
<text class="ts" x="500" y="760" text-anchor="middle" dominant-baseline="central">Once the PR is open</text></g>
<line x1="320" y1="750" x2="358" y2="750" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="778" x2="180" y2="816" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="778" x2="500" y2="816" class="arr" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="818" width="280" height="56" rx="8"/>
<text class="th" x="180" y="836" text-anchor="middle" dominant-baseline="central">Feature closed by hand</text>
<text class="ts" x="180" y="856" text-anchor="middle" dominant-baseline="central">Criteria checked on staging</text></g>
<g class="teal"><rect x="360" y="818" width="280" height="56" rx="8"/>
<text class="th" x="500" y="836" text-anchor="middle" dominant-baseline="central">plans/RETIRED</text>
<text class="ts" x="500" y="856" text-anchor="middle" dominant-baseline="central">Archived as history, never deleted</text></g>

<g class="purple"><rect x="140" y="900" width="14" height="14" rx="3"/></g>
<text class="ts legend" x="162" y="907" dominant-baseline="central">GitHub issue or PR</text>
<g class="teal"><rect x="300" y="900" width="14" height="14" rx="3"/></g>
<text class="ts legend" x="322" y="907" dominant-baseline="central">Vault, via skill</text>
<g class="gray"><rect x="440" y="900" width="14" height="14" rx="3"/></g>
<text class="ts legend" x="462" y="907" dominant-baseline="central">You and git</text>
</svg>
